appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "UIMenu on iOS, Material 3 menu elsewhere"
    direction: DOWN
- tapOn: "UIMenu on iOS, Material 3 menu elsewhere"
- waitForAnimationToEnd
- tapOn:
    text: "More options"
    index: 0
    optional: true
- tapOn:
    text: "More"
    optional: true
- waitForAnimationToEnd
- runFlow: ../_sleep.yaml
- takeScreenshot: AdaptiveDropdownMenu
- tapOn: "Edit"
