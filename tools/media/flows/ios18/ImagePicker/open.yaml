appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Photos from the gallery, previewed with Coil"
    direction: DOWN
- waitForAnimationToEnd
- waitForAnimationToEnd
- tapOn: "Photos from the gallery, previewed with Coil"
- waitForAnimationToEnd
- takeScreenshot: AdaptiveImagePicker
- tapOn: "Choose photos"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: AdaptiveImagePicker-system
- tapOn: "Cancel"
- waitForAnimationToEnd
